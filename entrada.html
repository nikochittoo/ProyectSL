<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<a class="skip" href="#ficha">Saltar al contenido</a>
<header>
  <div class="wrap">
    <!-- Reemplazar por el logo en verde: <img src="logo.svg" height="28" alt="Sacude Labs"> -->
    <a class="logo" href="index.html"><i></i>SACUDE LABS</a>
    <nav aria-label="Principal">
      <a href="index.html#feed">Registro</a>
      <a href="index.html?f=EXP#feed">Demos</a>
      <a href="index.html?f=SL#feed">Publicaciones</a>

      <a href="index.html?f=EVT#feed">Eventos</a>
      <a href="tablero.html">Tablero</a>
      <a href="sobre.html">Sobre el lab</a>
      <a href="sumate.html">Sumate</a>
    </nav>
  </div>
</header>

<main class="wrap" id="ficha"></main>

<footer><div class="wrap">Sacude Labs · Un espacio para explorar sin miedo a romper cosas, siempre con respeto.</div></footer>

<script src="data.js"></script>
<script src="app.js"></script>
<script>
const id = new URLSearchParams(location.search).get("id");
const i = ENTRADAS.findIndex(e => e.id === id);
const e = ENTRADAS[i];
const raiz = $("#ficha");
const url = x => "entrada.html?id=" + encodeURIComponent(x.id);
if(!e){
  raiz.innerHTML = `<a class="volver" href="index.html#feed">← volver al registro</a><p class="vacio">No existe el experimento "${esc(id)}". Revisá el código en data.js.</p>`;
} else {
  const t = TIPOS[prefijo(e.id)] || { nombre:"Otro" };
  const min = Math.max(1, Math.round(textoPlano(e.cuerpo || [e.texto]).split(/\s+/).length / 200));
  document.title = `[${e.id}] ${e.titulo} · Sacude Labs`;
  const nueva = ENTRADAS[i-1], vieja = ENTRADAS[i+1];
  const pag = (x, lado) => x ? `<a href="${url(x)}"><small>${lado}</small><b>[${esc(x.id)}]</b><span>${esc(x.titulo)}</span></a>` : `<span></span>`;
  raiz.innerHTML = `
    <a class="volver" href="index.html#feed">← volver al registro</a>
    <article class="ficha">
      <div class="meta"><span class="id">[${esc(e.id)}]</span><span class="date">${fmt(e.fecha)}</span></div>
      <div class="lec-bar"><span class="tag">${esc(t.nombre)}</span><span class="tiempo">≈ ${min} min de lectura</span><span class="lec-tools"><button type="button" class="btn lec-size" id="lec-menos" aria-label="Achicar letra">A−</button><button type="button" class="btn lec-size" id="lec-mas" aria-label="Agrandar letra">A+</button><button type="button" class="btn" id="lectura" aria-pressed="false">Modo lectura</button></span></div>
      <h1>${esc(e.titulo)}</h1>
      <div class="media">${media(e.media)}</div>
      <div class="cuerpo">${cuerpoHTML(e.cuerpo || [e.texto])}</div>
      <div class="links">${(e.links||[]).map(l=>`<a class="btn${l.main?" main":""}" href="${esc(l.url)}">${esc(l.t)}</a>`).join("")}</div>
      ${credito(e, true)}
    </article>
    <div class="pager">${pag(vieja,"← anterior")}${pag(nueva,"siguiente →")}</div>`;
}

/* ===== Modo lectura: letra grande, columna angosta, sin menú ni pie. Esc para salir ===== */
if(e){
  const guardar = (k, v) => { try{ localStorage.setItem(k, v); }catch(_){} };
  const leer = k => { try{ return localStorage.getItem(k); }catch(_){ return null; } };
  const btn = $("#lectura"); let tam = parseInt(leer("sl-lec-tam")) || 19;
  const aplicarTam = () => document.body.style.setProperty("--lec", tam + "px");
  const poner = (on, aviso) => {
    document.body.classList.toggle("lectura", on);
    btn.setAttribute("aria-pressed", on); btn.textContent = on ? "Salir" : "Modo lectura";
    guardar("sl-lectura", on ? "1" : "0");
    if(aviso) toast(on ? "Modo lectura · Esc para salir" : "Modo lectura desactivado");
  };
  aplicarTam();
  btn.addEventListener("click", () => poner(!document.body.classList.contains("lectura"), true));
  $("#lec-menos").addEventListener("click", () => { tam = Math.max(15, tam - 1); aplicarTam(); guardar("sl-lec-tam", tam); });
  $("#lec-mas").addEventListener("click", () => { tam = Math.min(28, tam + 1); aplicarTam(); guardar("sl-lec-tam", tam); });
  addEventListener("keydown", ev => { if(ev.key === "Escape" && document.body.classList.contains("lectura")) poner(false, true); });
  if(leer("sl-lectura") === "1") poner(true, false);
  // barra de progreso de lectura
  const prog = document.createElement("div"); prog.className = "lec-prog"; document.body.appendChild(prog);
  const act = () => { const h = document.documentElement.scrollHeight - innerHeight; prog.style.transform = `scaleX(${h > 0 ? Math.min(1, scrollY / h) : 0})`; };
  addEventListener("scroll", act, { passive:true }); addEventListener("resize", act); act();
}
</script>
</body>
</html>
